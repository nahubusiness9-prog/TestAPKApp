name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Create Android project folders
        run: |
          mkdir -p app/src/main/java/com/example/testapkapp
          mkdir -p app/src/main/res/values

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt app/src/main/java/com/example/testapkapp/MainActivity.kt
          cp styles.xml app/src/main/res/values/styles.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Give me the APK
        uses: actions/upload-artifact@v4
        with:
          name: TestAPK
          path: app/build/outputs/apk/debug/app-debug.apk
